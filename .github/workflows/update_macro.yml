name: Update macro data

on:
  schedule:
    # Check once a day at 15:00 UTC (about 10-11am ET), after the 8:30am ET releases.
    - cron: "0 15 * * *"
  workflow_dispatch:

# Allow the workflow to save the updated CSV to this repository.
permissions:
  contents: write

# Keep scheduled and manual runs from updating the data simultaneously.
concurrency:
  group: update-macro-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Download the latest version of the default branch.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      # 2. Set up Python and reuse cached dependencies when available.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # 3. Pull core CPI inflation, unemployment and fed funds from FRED.
      - name: Update macro CSV
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -z "$FRED_API_KEY" ]; then
            echo "::error::Add FRED_API_KEY as a GitHub Actions repository secret."
            exit 1
          fi
          python -B data/collect_macro.py

      # 4. Save only the macro CSV, and skip committing when nothing changed.
      - name: Commit updated CSV
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add data/macro.csv
          if git diff --cached --quiet; then
            echo "No CSV changes to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update macro data"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
