name: Update FOMC sentiment

on:
  schedule:
    # Check every hour at minute 17 (UTC).
    - cron: "17 * * * *"
  workflow_dispatch:

# Allow the workflow to save updated CSVs to this repository.
permissions:
  contents: write

# Keep scheduled and manual runs from updating the data simultaneously.
concurrency:
  group: update-fomc-sentiment
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Download the latest version of the default branch.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      # 2. Set up Python and reuse cached dependencies when available.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # 3. Download and score new statements using the existing Gemini function.
      - name: Check for new FOMC statements
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Add GEMINI_API_KEY as a GitHub Actions repository secret."
            exit 1
          fi
          python -B -m fomc_sentiment_analysis.check_new_statement

      # 4. Update monthly sentiment after the statement check succeeds.
      - name: Update monthly sentiment
        run: python -B -m fomc_sentiment_analysis.monthly_sentiment

      # 5. Save only the three CSVs, and skip committing when nothing changed.
      - name: Commit updated CSVs
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add data/fomc_statements.csv data/fomc_scores.csv data/fomc_monthly_sentiment.csv
          if git diff --cached --quiet; then
            echo "No CSV changes to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update FOMC sentiment data"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
